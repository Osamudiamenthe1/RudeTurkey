name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site
        run: |
          curl -sS -o /dev/null -w "site: %{http_code}\n" --max-time 30 \
            https://rudeturkey.pages.dev/

      - name: Ping menu_items
        run: |
          curl -sS -o /dev/null -w "menu_items: %{http_code}\n" --max-time 30 \
            "https://zsuewjxuvrnsrxighgqy.supabase.co/rest/v1/menu_items?select=name&limit=1" \
            -H "apikey: sb_publishable_b0iLHOza4_ZOTEAaKcH-nA_t3nmSxV-"

      - name: Ping site_settings
        run: |
          curl -sS -o /dev/null -w "site_settings: %{http_code}\n" --max-time 30 \
            "https://zsuewjxuvrnsrxighgqy.supabase.co/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: sb_publishable_b0iLHOza4_ZOTEAaKcH-nA_t3nmSxV-"
