<svg viewBox="0 0 600 375" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg5" cx="50%" cy="40%" r="75%">
    <stop offset="0%" stop-color="#2C2117"/><stop offset="100%" stop-color="#1C140E"/>
  </radialGradient>
  <linearGradient id="meat5" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C069"/>
    <stop offset="55%" stop-color="#D19B3A"/>
    <stop offset="100%" stop-color="#96601A"/>
