<circle cx="210" cy="180" r="7" fill="#241A14"/>
<circle cx="212" cy="177" r="2" fill="#F4E9D6"/>
<g fill="#5C6B4F" opacity="0.8">
  <circle cx="260" cy="150" r="3"/><circle cx="300" cy="230" r="3"/>
</g>
</svg>
