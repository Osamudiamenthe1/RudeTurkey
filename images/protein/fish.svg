</defs>
<rect width="600" height="375" fill="url(#bg5)"/>
<!-- fried fish body -->
<path d="M180 190 C 220 130, 320 120, 380 160 C 410 180, 410 210, 380 230 C 320 270, 220 260, 180 200 Z" fill="url(#meat5)"/>
<!-- tail -->
