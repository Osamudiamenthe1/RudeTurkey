  <path d="M220 155 C 240 175, 240 205, 220 225" fill="none"/>
  <path d="M260 145 C 280 175, 280 210, 260 235" fill="none"/>
  <path d="M300 145 C 320 175, 320 210, 300 235" fill="none"/>
</g>
