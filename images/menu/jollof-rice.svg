<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="plateShade" cx="50%" cy="42%" r="60%">
    <stop offset="0%" stop-color="#FBF3E2"/>
    <stop offset="100%" stop-color="#E7D8BC"/>
  </radialGradient>
  <radialGradient id="riceMound" cx="46%" cy="38%" r="65%">
    <stop offset="0%" stop-color="#E8752E"/>
    <stop offset="55%" stop-color="#D8481F"/>
    <stop offset="100%" stop-color="#9C3213"/>
  </radialGradient>
  <linearGradient id="plantain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0B94A"/>
    <stop offset="100%" stop-color="#C9822A"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#2C2117"/>
    <stop offset="100%" stop-color="#1C140E"/>
  </radialGradient>
</defs>

<rect width="800" height="600" fill="url(#bgGlow)"/>

<!-- plate -->
<ellipse cx="400" cy="330" rx="330" ry="205" fill="#1a130d" opacity="0.35"/>
<ellipse cx="400" cy="318" rx="325" ry="200" fill="url(#plateShade)"/>
<ellipse cx="400" cy="318" rx="325" ry="200" fill="none" stroke="#D8C7A2" stroke-width="3" opacity="0.6"/>
<ellipse cx="400" cy="318" rx="255" ry="158" fill="none" stroke="#D8C7A2" stroke-width="2" opacity="0.5"/>

<!-- jollof rice mound -->
<ellipse cx="392" cy="330" rx="225" ry="130" fill="url(#riceMound)"/>
<ellipse cx="340" cy="270" rx="150" ry="70" fill="#F0904A" opacity="0.45"/>

<!-- rice grain texture -->
<g fill="#F6B26B" opacity="0.55">
  <ellipse cx="300" cy="290" rx="7" ry="4" transform="rotate(15 300 290)"/>
  <ellipse cx="330" cy="260" rx="7" ry="4" transform="rotate(-10 330 260)"/>
  <ellipse cx="380" cy="255" rx="7" ry="4" transform="rotate(20 380 255)"/>
  <ellipse cx="420" cy="270" rx="7" ry="4" transform="rotate(-15 420 270)"/>
  <ellipse cx="460" cy="300" rx="7" ry="4" transform="rotate(10 460 300)"/>
  <ellipse cx="250" cy="330" rx="7" ry="4" transform="rotate(-20 250 330)"/>
  <ellipse cx="290" cy="360" rx="7" ry="4" transform="rotate(12 290 360)"/>
  <ellipse cx="350" cy="380" rx="7" ry="4" transform="rotate(-8 350 380)"/>
  <ellipse cx="410" cy="370" rx="7" ry="4" transform="rotate(18 410 370)"/>
  <ellipse cx="470" cy="345" rx="7" ry="4" transform="rotate(-12 470 345)"/>
  <ellipse cx="500" cy="310" rx="7" ry="4" transform="rotate(6 500 310)"/>
  <ellipse cx="230" cy="300" rx="7" ry="4" transform="rotate(-6 230 300)"/>
</g>

<!-- pepper flecks -->
<g fill="#B23A2E">
  <circle cx="320" cy="300" r="4"/>
  <circle cx="400" cy="285" r="4.5"/>
  <circle cx="440" cy="330" r="4"/>
  <circle cx="360" cy="345" r="4"/>
  <circle cx="290" cy="345" r="3.5"/>
  <circle cx="450" cy="300" r="3.5"/>
</g>

<!-- green garnish (spring onion) -->
<g stroke="#5C6B4F" stroke-width="6" stroke-linecap="round" opacity="0.85">
  <line x1="360" y1="270" x2="345" y2="240"/>
  <line x1="390" y1="265" x2="400" y2="232"/>
  <line x1="420" y1="275" x2="435" y2="245"/>
</g>

<!-- fried plantain slices -->
<g>
  <ellipse cx="560" cy="380" rx="42" ry="20" fill="url(#plantain)" transform="rotate(-18 560 380)"/>
  <ellipse cx="600" cy="360" rx="42" ry="20" fill="url(#plantain)" transform="rotate(-10 600 360)"/>
  <ellipse cx="560" cy="380" rx="42" ry="20" fill="none" stroke="#8A5A1E" stroke-width="2" opacity="0.4" transform="rotate(-18 560 380)"/>
</g>

<!-- steam -->
<g stroke="#F4E9D6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35">
  <path d="M370 180 C 360 150, 385 140, 375 110" />
  <path d="M410 185 C 420 155, 398 145, 408 115" />
</g>
</svg>
